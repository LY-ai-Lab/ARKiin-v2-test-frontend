<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARKiin v2.0 — Production 6-Step Test</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#0a0a0f,#1a1a2e);color:#f0f0f0;min-height:100vh;padding:20px}
.container{max-width:1100px;margin:0 auto}
.header{text-align:center;padding:40px 20px;background:rgba(108,99,255,0.1);border:2px solid #6c63ff;border-radius:16px;margin-bottom:32px}
.logo{font-size:3rem;font-weight:900;letter-spacing:3px;background:linear-gradient(135deg,#6c63ff,#4CAF50);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.subtitle{color:#aaa;margin-top:12px;font-size:1.1rem}
.badge{display:inline-block;background:#6c63ff;color:#fff;padding:6px 16px;border-radius:20px;font-size:0.8rem;margin-top:12px;font-weight:600}
.steps-grid{display:grid;gap:20px;margin-bottom:32px}
.step-card{background:rgba(26,26,46,0.8);border:2px solid #2a2a4e;border-radius:12px;padding:24px;position:relative;overflow:hidden}
.step-card.active{border-color:#6c63ff}
.step-card.pass{border-color:#4CAF50;background:rgba(76,175,80,0.05)}
.step-card.fail{border-color:#f44336;background:rgba(244,67,54,0.05)}
.step-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.step-number{width:40px;height:40px;border-radius:50%;background:#2a2a4e;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem;flex-shrink:0}
.step-card.active .step-number{background:#6c63ff;box-shadow:0 0 20px #6c63ff}
.step-card.pass .step-number{background:#4CAF50}
.step-card.fail .step-number{background:#f44336}
.step-title{font-size:1.1rem;font-weight:700}
.step-desc{color:#999;font-size:0.85rem;margin-bottom:16px}
.step-status{display:flex;align-items:center;gap:8px;font-size:0.9rem;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:#444}
.dot.pulse{animation:pulse 1.2s infinite}
.dot.green{background:#4CAF50;box-shadow:0 0 12px #4CAF50}
.dot.red{background:#f44336;box-shadow:0 0 12px #f44336}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.step-output{background:#0a0a0f;border:1px solid #333;border-radius:8px;padding:12px;font-family:monospace;font-size:0.75rem;color:#0f9;margin-top:12px;max-height:150px;overflow-y:auto}
.step-output.err{color:#f55}
.btn-row{display:flex;gap:12px;margin-top:20px;justify-content:center}
.btn{background:#6c63ff;color:#fff;border:none;padding:14px 32px;border-radius:8px;cursor:pointer;font-size:1rem;font-weight:700;transition:all .2s;text-transform:uppercase;letter-spacing:1px}
.btn:hover{background:#5a52d5;transform:translateY(-2px)}
.btn:disabled{background:#333;cursor:not-allowed;transform:none;opacity:0.6}
.btn.secondary{background:#2a2a4e}
.btn.secondary:hover{background:#3a3a5e}
.summary{background:rgba(26,26,46,0.8);border:2px solid #2a2a4e;border-radius:12px;padding:24px;text-align:center}
.summary.success{border-color:#4CAF50}
.summary.error{border-color:#f44336}
.summary-title{font-size:1.5rem;margin-bottom:12px;font-weight:800}
.summary-stats{display:flex;justify-content:center;gap:32px;margin-top:16px}
.stat{display:flex;flex-direction:column;align-items:center}
.stat-value{font-size:2.5rem;font-weight:900}
.stat-label{color:#aaa;font-size:0.85rem;margin-top:4px}
.stat.pass .stat-value{color:#4CAF50}
.stat.fail .stat-value{color:#f44336}
@media(max-width:768px){.steps-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">ARKiin v2.0</div>
    <div class="subtitle">Production 6-Step Backend Test Suite</div>
    <div class="badge">LIVE ENVIRONMENT</div>
  </div>

  <div class="steps-grid" id="stepsGrid"></div>

  <div class="btn-row">
    <button class="btn" id="runBtn" onclick="runAllTests()">Run All Tests</button>
    <button class="btn secondary" onclick="resetTests()">Reset</button>
  </div>

  <div class="summary" id="summary" style="display:none">
    <div class="summary-title" id="summaryTitle"></div>
    <div class="summary-stats">
      <div class="stat pass"><div class="stat-value" id="passCount">0</div><div class="stat-label">PASSED</div></div>
      <div class="stat fail"><div class="stat-value" id="failCount">0</div><div class="stat-label">FAILED</div></div>
    </div>
  </div>
</div>

<script>
const BASE='https://arkiin-api-189193911117.europe-west3.run.app';
const steps=[
{n:1,title:'Health Check',desc:'Verify backend is reachable and healthy',fn:async()=>{
const r=await fetch(BASE+'/health');
if(!r.ok)throw new Error('HTTP '+r.status);
const j=await r.json();
if(j.status!=='ok')throw new Error('status='+j.status);
return {status:j.status,version:j.version};}},
{n:2,title:'Version Verification',desc:'Confirm backend is v2.0.0',fn:async()=>{
const r=await fetch(BASE+'/health');
const j=await r.json();
if(j.version!=='2.0.0')throw new Error('Expected v2.0.0, got '+j.version);
return {version:j.version};}},
{n:3,title:'Response Time',desc:'Check latency under 2000ms',fn:async()=>{
const t0=Date.now();
const r=await fetch(BASE+'/health');
const ms=Date.now()-t0;
if(ms>2000)throw new Error('Latency '+ms+'ms exceeds 2000ms');
return {latency:ms+'ms'};}},
{n:4,title:'API Endpoint Test',desc:'Test /api/v1/taste/styles endpoint existence',fn:async()=>{
const r=await fetch(BASE+'/api/v1/taste/styles');
if(r.status===500||r.status===502||r.status===503)throw new Error('Server error: '+r.status);
return {status:r.status};}},
{n:5,title:'Error Handling',desc:'Verify 404 for invalid endpoints',fn:async()=>{
const r=await fetch(BASE+'/invalid-endpoint-test');
if(r.status!==404)throw new Error('Expected 404, got '+r.status);
return {status:404,message:'Correct error handling'};}},
{n:6,title:'CORS Headers',desc:'Check cross-origin resource sharing',fn:async()=>{
const r=await fetch(BASE+'/health');
const cors=r.headers.get('access-control-allow-origin');
return {cors:cors||'Not set',note:'Backend allows direct access'};}}
];
let currentStep=0;
let passed=0,failed=0;
function createStepCard(s){
return`<div class="step-card" id="step${s.n}"><div class="step-header"><div class="step-number">${s.n}</div><div><div class="step-title">${s.title}</div><div class="step-desc">${s.desc}</div></div></div><div class="step-status"><div class="dot" id="dot${s.n}"></div><span id="status${s.n}">Pending</span></div><div class="step-output" id="out${s.n}" style="display:none"></div></div>`;}
function init(){
document.getElementById('stepsGrid').innerHTML=steps.map(createStepCard).join('');}
function setStatus(n,status,msg,data){
const card=document.getElementById('step'+n);
const dot=document.getElementById('dot'+n);
const statusEl=document.getElementById('status'+n);
const out=document.getElementById('out'+n);
card.className='step-card '+status;
dot.className='dot '+(status==='pass'?'green':'red');
statusEl.textContent=msg;
if(data){out.style.display='block';out.className='step-output'+(status==='fail'?' err':'');out.textContent=JSON.stringify(data,null,2);}}
async function runStep(s){
const card=document.getElementById('step'+s.n);
card.className='step-card active';
const dot=document.getElementById('dot'+s.n);
dot.className='dot pulse';
document.getElementById('status'+s.n).textContent='Running...';
try{
const result=await s.fn();
setStatus(s.n,'pass','PASS',result);
passed++;}catch(e){
setStatus(s.n,'fail','FAIL',{error:e.message});
failed++;}}
async function runAllTests(){
document.getElementById('runBtn').disabled=true;
document.getElementById('summary').style.display='none';
passed=0;failed=0;
for(const s of steps){await runStep(s);await new Promise(r=>setTimeout(r,500));}
document.getElementById('runBtn').disabled=false;
showSummary();}
function showSummary(){
const sum=document.getElementById('summary');
const title=document.getElementById('summaryTitle');
sum.style.display='block';
sum.className='summary '+(failed===0?'success':'error');
title.textContent=failed===0?'✅ All Tests Passed!':'❌ Some Tests Failed';
document.getElementById('passCount').textContent=passed;
document.getElementById('failCount').textContent=failed;}
function resetTests(){
init();
document.getElementById('summary').style.display='none';}
init();
</script>
</body>
</html>
